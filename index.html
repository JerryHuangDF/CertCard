<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Pokémon Card</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08081a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(ellipse 90% 70% at 15% 15%, rgba(90, 0, 220, 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 70% 70% at 85% 85%, rgba(0, 60, 220, 0.14) 0%, transparent 65%),
        radial-gradient(1.5px 1.5px at 8%  12%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 25%  38%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 42%   8%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 65%  22%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78%  5%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 91%  48%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 55%  72%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 18%  68%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 48%  90%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 83%  75%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 33%  55%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at  5%  45%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 70%  95%, #fff 0%, transparent 100%);
      opacity: 0.55;
    }

    /* ── Headings ── */
    h1 {
      font: 300 clamp(0.8rem, 2vw, 1rem) / 1 -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-bottom: clamp(28px, 5vh, 52px);
      position: relative;
    }

    .hint {
      margin-top: clamp(20px, 4vh, 40px);
      font: 300 0.62rem / 1 -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      position: relative;
    }

    /* ── 3-D Scene ── */
    .scene {
      perspective: 900px;
      perspective-origin: 50% 50%;
      position: relative;
      z-index: 1;
    }

    /* ── Card shell ── */
    .card {
      --rx: 0deg;
      --ry: 0deg;
      --s: 1;
      --mx: 50%;
      --my: 50%;
      --bgx: 50%;
      --bgy: 50%;

      width: clamp(200px, 38vw, 270px);
      aspect-ratio: 5 / 7;
      position: relative;
      cursor: pointer;
      will-change: transform;
      transform: rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      border-radius: 4.8% / 3.4%;
      isolation: isolate;
    }

    .card.active { transition: none; }

    .card-face {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 28px 60px -10px rgba(0, 0, 0, 0.8),
        0 12px 28px -8px  rgba(0, 0, 0, 0.55),
        0 0 0 1px          rgba(255,255,255,0.07) inset;
    }

    .card-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: inherit;
    }

    /* ══════════════════════════════
       HOLOGRAPHIC EFFECT LAYERS
       ══════════════════════════════ */

    .card-holo,
    .card-sparkles,
    .card-glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* Layer 1 — rainbow foil (color-dodge shifts with bg position) */
    .card-holo {
      background-image:
        repeating-linear-gradient(
          0deg,
          hsl(  0, 100%, 68%) 0%,
          hsl( 45, 100%, 68%) 12.5%,
          hsl( 90, 100%, 68%) 25%,
          hsl(135, 100%, 68%) 37.5%,
          hsl(180, 100%, 68%) 50%,
          hsl(225, 100%, 68%) 62.5%,
          hsl(270, 100%, 68%) 75%,
          hsl(315, 100%, 68%) 87.5%,
          hsl(  0, 100%, 68%) 100%
        ),
        repeating-linear-gradient(
          133deg,
          #0d1232 0%,
          hsl(180, 10%, 82%) 3.5%,
          hsl(180, 29%, 72%) 4.5%,
          hsl(180, 10%, 82%) 5.5%,
          #0d1232 10%,
          #0d1232 12%
        );
      background-size: 300% 300%, 200% 700%;
      background-position: var(--bgx) var(--bgy);
      mix-blend-mode: color-dodge;
      filter: brightness(0.55) contrast(3) saturate(1.3);
    }

    /* Layer 2 — sparkle dot grid */
    .card-sparkles {
      background-image:
        radial-gradient(ellipse at var(--mx) var(--my),
          rgba(255,255,255,0.4) 0%,
          transparent 55%),
        radial-gradient(circle, rgba(255,255,255,0.9) 0.5px, transparent 0.5px),
        radial-gradient(circle, rgba(255,255,255,0.8) 0.5px, transparent 0.5px);
      background-size: 100% 100%, 22px 22px, 15px 15px;
      background-position: 0 0, 0 0, 6px 6px;
      mix-blend-mode: color-dodge;
      filter: brightness(1.2);
    }

    /* Layer 3 — specular glare */
    .card-glare {
      background: radial-gradient(
        farthest-corner circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.88) 10%,
        rgba(255, 255, 255, 0.60) 22%,
        rgba(  0,   0,   0, 0.55) 90%
      );
      mix-blend-mode: overlay;
    }

    /* Show effects on hover / while interacting */
    .card:hover   .card-holo,
    .card:hover   .card-sparkles,
    .card:hover   .card-glare,
    .card.active  .card-holo,
    .card.active  .card-sparkles,
    .card.active  .card-glare { opacity: 1; }

    /* ── Credit ── */
    .credit {
      position: fixed;
      bottom: 14px;
      right: 16px;
      font: 300 0.58rem / 1 -apple-system, sans-serif;
      color: rgba(255,255,255,0.18);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .credit:hover { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>

  <div class="bg"></div>

  <h1>Holographic Pokémon Card</h1>

  <div class="scene">
    <div class="card" id="card">
      <div class="card-face">
        <img
          class="card-img"
          id="card-img"
          src="https://images.pokemontcg.io/base1/4.png"
          alt="Charizard Holo"
          loading="eager"
        />
        <div class="card-holo"></div>
        <div class="card-sparkles"></div>
        <div class="card-glare"></div>
      </div>
    </div>
  </div>

  <p class="hint">Move your mouse over the card</p>

  <a
    class="credit"
    href="https://github.com/simeydotme/pokemon-cards-css"
    target="_blank"
    rel="noopener noreferrer"
  >Inspired by simeydotme/pokemon-cards-css</a>

  <script>
    'use strict';

    const card = document.getElementById('card');

    /* ── Spring physics ── */
    function Spring(init, k, d) {
      this.v   = init;
      this.t   = init;
      this.vel = 0;
      this.k   = k || 0.075;
      this.d   = d || 0.52;
    }
    Spring.prototype.tick = function () {
      this.vel = (this.vel + (this.t - this.v) * this.k) * (1 - this.d);
      this.v  += this.vel;
      return this.v;
    };
    Spring.prototype.settled = function () {
      return Math.abs(this.t - this.v) < 0.04 && Math.abs(this.vel) < 0.04;
    };

    const S = {
      rx:  new Spring(0,  0.075, 0.52),
      ry:  new Spring(0,  0.075, 0.52),
      bgx: new Spring(50, 0.06,  0.50),
      bgy: new Spring(50, 0.06,  0.50),
      mx:  new Spring(50, 0.10,  0.55),
      my:  new Spring(50, 0.10,  0.55),
      s:   new Spring(1,  0.05,  0.55),
    };

    let raf         = null;
    let interacting = false;
    let showId      = null;

    function push() {
      card.style.setProperty('--rx',  S.rx.v.toFixed(2)  + 'deg');
      card.style.setProperty('--ry',  S.ry.v.toFixed(2)  + 'deg');
      card.style.setProperty('--bgx', S.bgx.v.toFixed(1) + '%');
      card.style.setProperty('--bgy', S.bgy.v.toFixed(1) + '%');
      card.style.setProperty('--mx',  S.mx.v.toFixed(1)  + '%');
      card.style.setProperty('--my',  S.my.v.toFixed(1)  + '%');
      card.style.setProperty('--s',   S.s.v.toFixed(4));
    }

    function loop() {
      Object.values(S).forEach(function (s) { s.tick(); });
      push();
      var settled = !interacting && Object.values(S).every(function (s) { return s.settled(); });
      raf = settled ? null : requestAnimationFrame(loop);
    }

    function go() { if (!raf) raf = requestAnimationFrame(loop); }

    function aim(px, py) {
      S.rx.t  = -(py - 50) / 50 * 18;
      S.ry.t  =  (px - 50) / 50 * 18;
      S.bgx.t = px;
      S.bgy.t = py;
      S.mx.t  = px;
      S.my.t  = py;
    }

    function reset() {
      S.rx.t = S.ry.t = 0;
      S.bgx.t = S.bgy.t = 50;
      S.mx.t  = S.my.t  = 50;
      S.s.t   = 1;
    }

    /* ── Mouse ── */
    card.addEventListener('mousemove', function (e) {
      var r = card.getBoundingClientRect();
      aim(
        (e.clientX - r.left) / r.width  * 100,
        (e.clientY - r.top)  / r.height * 100
      );
      S.s.t = 1.065;
      interacting = true;
      card.classList.add('active');
      go();
    });

    card.addEventListener('mouseenter', function () {
      clearTimeout(showId);
    });

    card.addEventListener('mouseleave', function () {
      interacting = false;
      card.classList.remove('active');
      reset();
      go();
      showId = setTimeout(showcase, 2500);
    });

    /* ── Touch ── */
    card.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var t = e.touches[0];
      var r = card.getBoundingClientRect();
      aim(
        Math.min(100, Math.max(0, (t.clientX - r.left) / r.width  * 100)),
        Math.min(100, Math.max(0, (t.clientY - r.top)  / r.height * 100))
      );
      S.s.t = 1.065;
      interacting = true;
      card.classList.add('active');
      go();
    }, { passive: false });

    card.addEventListener('touchend', function () {
      interacting = false;
      card.classList.remove('active');
      reset();
      go();
    });

    /* ── Device orientation (mobile tilt) ── */
    window.addEventListener('deviceorientation', function (e) {
      if (interacting) return;
      var beta  = Math.min(60, Math.max(-60, e.beta  || 0));
      var gamma = Math.min(60, Math.max(-60, e.gamma || 0));
      aim(50 + gamma / 60 * 40, 50 + beta / 60 * 40);
      card.classList.add('active');
      go();
    });

    /* ── Auto-showcase animation ── */
    function showcase() {
      if (interacting) return;
      var f = 0;
      var total = 60 * 5;   /* 5 s at 60 fps */

      (function frame() {
        if (interacting) {
          card.classList.remove('active');
          reset();
          go();
          return;
        }
        f++;
        var t  = (f / 60) * Math.PI * 2 * 0.45;
        var px = 50 + Math.sin(t)        * 38;
        var py = 50 + Math.cos(t * 0.78) * 30;
        S.bgx.t = px;
        S.bgy.t = py;
        S.rx.t  = -Math.cos(t * 0.78) * 13;
        S.ry.t  =  Math.sin(t)         * 16;
        S.mx.t  = px;
        S.my.t  = py;
        card.classList.add('active');
        go();

        if (f < total) {
          showId = setTimeout(frame, 1000 / 60);
        } else {
          card.classList.remove('active');
          reset();
          go();
        }
      }());
    }

    /* Kick off showcase on load */
    showId = setTimeout(showcase, 900);
  </script>
</body>
</html>
