<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonfly UAS — CertCard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08081a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(ellipse 90% 70% at 15% 15%, rgba(90, 0, 220, 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 70% 70% at 85% 85%, rgba(0, 60, 220, 0.14) 0%, transparent 65%),
        radial-gradient(1.5px 1.5px at 8%  12%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 25%  38%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 42%   8%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 65%  22%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78%  5%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 91%  48%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 55%  72%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 18%  68%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 48%  90%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 83%  75%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 33%  55%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at  5%  45%, #fff 0%, transparent 100%),
        radial-gradient(1px   1px at 70%  95%, #fff 0%, transparent 100%);
      opacity: 0.55;
    }

    /* ── Headings ── */
    h1 {
      font: 300 clamp(0.8rem, 2vw, 1rem) / 1 -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-bottom: clamp(28px, 5vh, 52px);
      position: relative;
    }

    .hint {
      margin-top: clamp(20px, 4vh, 40px);
      font: 300 0.62rem / 1 -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      position: relative;
    }

    /* ── 3-D Scene ── */
    .scene {
      perspective: 900px;
      perspective-origin: 50% 50%;
      position: relative;
      z-index: 1;
    }

    /* ── Card shell ── */
    .card {
      --rx:  0deg;
      --ry:  0deg;
      --s:   1;
      --mx:  50%;
      --my:  50%;
      --bgx: 50%;
      --bgy: 50%;
      --pfc: 0;        /* pointer-from-center: 0 = at center, 1 = at corner */

      /* Card proportions match the drone card image (941 × 1671 px) */
      width: clamp(185px, 33vw, 235px);
      aspect-ratio: 630 / 882;
      position: relative;
      cursor: pointer;
      will-change: transform;
      transform: rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      border-radius: 5.5% / 3.2%;
      isolation: isolate;
    }

    .card.active { transition: none; }

    .card-face {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      position: relative;
      background: transparent;
      box-shadow:
        0 30px 70px -10px rgba(0, 200, 255, 0.15),
        0 20px 45px -10px rgba(0, 0, 0, 0.85),
        0 10px 25px -8px  rgba(0, 0, 0, 0.6),
        0 0 0 1px          rgba(0, 180, 255, 0.12) inset;
    }

    .card-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: inherit;
    }

    /* ══════════════════════════════════════════════
       HOLOGRAPHIC EFFECT LAYERS
       ══════════════════════════════════════════════ */

    .card-holo,
    .card-sparkles,
    .card-glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    /*
     * Layer 1 — rainbow foil + crystal crosshatch grid
     *
     * How it works:
     *  • Three background layers stacked bottom→top:
     *    [2] 45°  crystal stripes  (transparent dark + white bright bands)
     *    [1] 133° crystal stripes  (transparent dark + white bright bands)
     *    [0] Rainbow gradient      (semi-transparent, shifts with bgx/bgy)
     *        – angle rotates with card tilt (var(--ry))
     *        – reveals different hues as you tilt
     *  • The two crystal layers create an INTERSECTING diamond grid;
     *    where both bands coincide the composite is brightest.
     *  • filter: brightness(0.42) contrast(1.8) accentuates bright bands
     *    and suppresses dark areas before color-dodge is applied.
     *  • mix-blend-mode: color-dodge then lifts only the card's lighter
     *    pixels with rainbow colour, leaving dark card areas unaffected.
     *  • opacity driven by --pfc: 0 when pointer is at centre (no tilt),
     *    rising to ~1 at the card's corner (max tilt) — matches real foil.
     */
    .card-holo {
      background-image:
        /* [0] Semi-transparent rainbow – angle tracks card tilt */
        repeating-linear-gradient(
          calc(90deg + var(--ry, 0deg) * 2),
          hsla(  0, 100%, 50%, 0.65) 0%,
          hsla( 60, 100%, 50%, 0.65) 8.33%,
          hsla(120, 100%, 50%, 0.65) 16.66%,
          hsla(180, 100%, 50%, 0.65) 25%,
          hsla(240, 100%, 50%, 0.65) 33.33%,
          hsla(300, 100%, 50%, 0.65) 41.66%,
          hsla(  0, 100%, 50%, 0.65) 50%
        ),
        /* [1] Crystal stripes at 133° */
        repeating-linear-gradient(
          133deg,
          transparent       0%,    transparent       9%,
          rgba(255,255,255,0.5) 9.5%,
          rgba(255,255,255,0.8) 10.5%,
          rgba(255,255,255,0.5) 11%,
          transparent       11.5%, transparent       21%
        ),
        /* [2] Crystal stripes at 45° – creates diamond intersections */
        repeating-linear-gradient(
          45deg,
          transparent       0%,    transparent       9%,
          rgba(255,255,255,0.4) 9.5%,
          rgba(255,255,255,0.7) 10.5%,
          rgba(255,255,255,0.4) 11%,
          transparent       11.5%, transparent       21%
        );

      background-size:
        160% 160%,   /* rainbow  – big enough to always show multiple hues */
        100% 100%,   /* crystal1 – 1:1 with card gives ~4px stripe width   */
        100% 100%;   /* crystal2 */

      /* Crystal grids scroll at 60% the rate of the rainbow → relative drift */
      background-position:
        var(--bgx, 50%) var(--bgy, 50%),
        calc(var(--bgx, 50%) * 0.6) calc(var(--bgy, 50%) * 0.6),
        calc(var(--bgx, 50%) * 0.4) calc(var(--bgy, 50%) * 0.4);

      mix-blend-mode: color-dodge;

      /* Bring rainbow closer to mid-range so color-dodge stays subtle */
      filter: brightness(0.42) contrast(1.8) saturate(2);

      /* Fade in from zero as the pointer moves away from card centre */
      opacity: calc(var(--pfc, 0) * 0.95);
    }

    /* Layer 2 — soft local sparkle/glow at pointer position */
    .card-sparkles {
      background: radial-gradient(
        ellipse 60% 50% at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, 0.22) 0%,
        transparent 80%
      );
      mix-blend-mode: overlay;
      opacity: calc(var(--pfc, 0) * 0.8);
    }

    /* Layer 3 — specular highlight that follows the pointer */
    .card-glare {
      background: radial-gradient(
        farthest-corner circle at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, 0.92) 10%,
        rgba(255, 255, 255, 0.65) 22%,
        rgba(  0,   0,   0, 0.52) 90%
      );
      mix-blend-mode: overlay;
      /* Small base so the glare is barely visible even at centre */
      opacity: calc(var(--pfc, 0) * 0.85 + 0.04);
    }

    /* ── Credit ── */
    .credit {
      position: fixed;
      bottom: 14px;
      right: 16px;
      font: 300 0.58rem / 1 -apple-system, sans-serif;
      color: rgba(255,255,255,0.18);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .credit:hover { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>

  <div class="bg"></div>

  <h1>Dragonfly UAS — CertCard</h1>

  <div class="scene">
    <div class="card" id="card">
      <div class="card-face">
        <img
          class="card-img"
          src="card_v2.png"
          alt="Dragonfly UAS Drone Card"
          loading="eager"
        />
        <div class="card-holo"></div>
        <div class="card-sparkles"></div>
        <div class="card-glare"></div>
      </div>
    </div>
  </div>

  <p class="hint">Hover &amp; tilt to activate holographic foil</p>

  <a
    class="credit"
    href="https://github.com/simeydotme/pokemon-cards-css"
    target="_blank"
    rel="noopener noreferrer"
  >Inspired by simeydotme/pokemon-cards-css</a>

  <script>
    'use strict';

    var card = document.getElementById('card');

    /* ── Spring physics ── */
    function Spring(init, k, d) {
      this.v   = init;
      this.t   = init;
      this.vel = 0;
      this.k   = k || 0.075;
      this.d   = d || 0.52;
    }
    Spring.prototype.tick = function () {
      this.vel = (this.vel + (this.t - this.v) * this.k) * (1 - this.d);
      this.v  += this.vel;
      return this.v;
    };
    Spring.prototype.settled = function () {
      return Math.abs(this.t - this.v) < 0.04 && Math.abs(this.vel) < 0.04;
    };

    var S = {
      rx:  new Spring(0,  0.075, 0.52),
      ry:  new Spring(0,  0.075, 0.52),
      bgx: new Spring(50, 0.06,  0.50),
      bgy: new Spring(50, 0.06,  0.50),
      mx:  new Spring(50, 0.10,  0.55),
      my:  new Spring(50, 0.10,  0.55),
      s:   new Spring(1,  0.05,  0.55),
      pfc: new Spring(0,  0.09,  0.48),   /* pointer-from-centre, animates smoothly */
    };

    var raf         = null;
    var interacting = false;
    var showId      = null;

    function push() {
      card.style.setProperty('--rx',  S.rx.v.toFixed(2)  + 'deg');
      card.style.setProperty('--ry',  S.ry.v.toFixed(2)  + 'deg');
      card.style.setProperty('--bgx', S.bgx.v.toFixed(1) + '%');
      card.style.setProperty('--bgy', S.bgy.v.toFixed(1) + '%');
      card.style.setProperty('--mx',  S.mx.v.toFixed(1)  + '%');
      card.style.setProperty('--my',  S.my.v.toFixed(1)  + '%');
      card.style.setProperty('--s',   S.s.v.toFixed(4));
      card.style.setProperty('--pfc', S.pfc.v.toFixed(3));
    }

    function loop() {
      var keys = Object.keys(S);
      for (var i = 0; i < keys.length; i++) S[keys[i]].tick();
      push();
      var settled = !interacting;
      if (settled) {
        for (var j = 0; j < keys.length; j++) {
          if (!S[keys[j]].settled()) { settled = false; break; }
        }
      }
      raf = settled ? null : requestAnimationFrame(loop);
    }

    function go() { if (!raf) raf = requestAnimationFrame(loop); }

    function ptrFrom(px, py) {
      /* Euclidean distance from card centre, clamped to [0,1] */
      var dx = (px - 50) / 50;
      var dy = (py - 50) / 50;
      return Math.min(1, Math.sqrt(dx * dx + dy * dy));
    }

    function aim(px, py) {
      S.pfc.t = ptrFrom(px, py);
      S.rx.t  = -(py - 50) / 50 * 15;   /* max ±15° tilt */
      S.ry.t  =  (px - 50) / 50 * 15;
      S.bgx.t = px;
      S.bgy.t = py;
      S.mx.t  = px;
      S.my.t  = py;
    }

    function reset() {
      S.pfc.t = 0;
      S.rx.t  = S.ry.t  = 0;
      S.bgx.t = S.bgy.t = 50;
      S.mx.t  = S.my.t  = 50;
      S.s.t   = 1;
    }

    /* ── Mouse ── */
    card.addEventListener('mousemove', function (e) {
      var r = card.getBoundingClientRect();
      aim(
        (e.clientX - r.left) / r.width  * 100,
        (e.clientY - r.top)  / r.height * 100
      );
      S.s.t = 1.06;
      interacting = true;
      card.classList.add('active');
      go();
    });

    card.addEventListener('mouseenter', function () {
      clearTimeout(showId);
    });

    card.addEventListener('mouseleave', function () {
      interacting = false;
      card.classList.remove('active');
      reset();
      go();
      showId = setTimeout(showcase, 2500);
    });

    /* ── Touch ── */
    card.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var t = e.touches[0];
      var r = card.getBoundingClientRect();
      aim(
        Math.min(100, Math.max(0, (t.clientX - r.left) / r.width  * 100)),
        Math.min(100, Math.max(0, (t.clientY - r.top)  / r.height * 100))
      );
      S.s.t = 1.06;
      interacting = true;
      card.classList.add('active');
      go();
    }, { passive: false });

    card.addEventListener('touchend', function () {
      interacting = false;
      card.classList.remove('active');
      reset();
      go();
    });

    /* ── Device orientation (mobile physical tilt) ── */
    window.addEventListener('deviceorientation', function (e) {
      if (interacting) return;
      var beta  = Math.min(60, Math.max(-60, e.beta  || 0));
      var gamma = Math.min(60, Math.max(-60, e.gamma || 0));
      var px = 50 + gamma / 60 * 40;
      var py = 50 + beta  / 60 * 40;
      aim(px, py);
      card.classList.add('active');
      go();
    });

    /* ── Auto-showcase animation ── */
    function showcase() {
      if (interacting) return;
      var f = 0;
      var total = 60 * 5;  /* 5 s */

      (function frame() {
        if (interacting) {
          card.classList.remove('active');
          reset();
          go();
          return;
        }
        f++;
        var t  = (f / 60) * Math.PI * 2 * 0.42;
        var px = 50 + Math.sin(t)        * 34;
        var py = 50 + Math.cos(t * 0.78) * 26;
        S.pfc.t = ptrFrom(px, py);
        S.bgx.t = px;
        S.bgy.t = py;
        S.rx.t  = -Math.cos(t * 0.78) * 10;
        S.ry.t  =  Math.sin(t)         * 12;
        S.mx.t  = px;
        S.my.t  = py;
        card.classList.add('active');
        go();

        if (f < total) {
          showId = setTimeout(frame, 1000 / 60);
        } else {
          card.classList.remove('active');
          reset();
          go();
        }
      }());
    }

    /* Start showcase shortly after load */
    showId = setTimeout(showcase, 900);
  </script>
</body>
</html>
